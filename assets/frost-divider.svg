<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30">
  <defs>
    <linearGradient id="auroraDividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="20%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spiritGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <g id="miniFlakeArm">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="url(#spiritGem)" stroke-width="0.9" stroke-linecap="round" />
      <path d="M 0,-6 L -3.5,-8.5 M 0,-6 L 3.5,-8.5" stroke="#7DD3FC" stroke-width="0.75" stroke-linecap="round" />
      <circle cx="0" cy="-10.5" r="0.6" fill="#F0FDF4" />
    </g>
  </defs>

  <!-- Central Aurora Beam -->
  <line x1="100" y1="15" x2="800" y2="15" stroke="url(#auroraDividerGrad)" stroke-width="1" />
  
  <!-- Symmetric Elemental Diamond Accents -->
  <line x1="240" y1="12" x2="350" y2="12" stroke="#34D399" stroke-width="0.6" stroke-dasharray="2, 5" opacity="0.6" />
  <line x1="550" y1="12" x2="660" y2="12" stroke="#C084FC" stroke-width="0.6" stroke-dasharray="2, 5" opacity="0.6" />
  
  <!-- Flanking Spirit Crystals -->
  <circle cx="295" cy="15" r="1.8" fill="#34D399" />
  <circle cx="605" cy="15" r="1.8" fill="#C084FC" />

  <!-- Center 6-Fold Elsa Snowflake -->
  <g transform="translate(450 15)">
    <!-- Concentric Aurora Rings -->
    <circle cx="0" cy="0" r="11" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2, 3" opacity="0.7" />
    
    <!-- 6 Symmetrical Arms -->
    <use href="#miniFlakeArm" />
    <use href="#miniFlakeArm" transform="rotate(60)" />
    <use href="#miniFlakeArm" transform="rotate(120)" />
    <use href="#miniFlakeArm" transform="rotate(180)" />
    <use href="#miniFlakeArm" transform="rotate(240)" />
    <use href="#miniFlakeArm" transform="rotate(300)" />

    <!-- Center Snowflake Gem Core -->
    <circle cx="0" cy="0" r="3" fill="#040914" stroke="#34D399" stroke-width="1" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
